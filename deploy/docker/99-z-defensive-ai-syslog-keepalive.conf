# Bound stale TCP connection detection for the single-host Syslog collector.
# Vector sets TCP_KEEPIDLE on each listener; these defaults also cover the
# probe interval/count and survive a host reboot.
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 4
