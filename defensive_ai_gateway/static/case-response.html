<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Case Response Pack</title>
    <link rel="icon" href="/logo-mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="case-response-page">
    <header class="case-response-header">
      <button id="case-response-back" class="case-response-back" type="button">返回 Case</button>
      <div class="case-response-heading">
        <span id="case-response-kicker">Respond powered by AI</span>
        <h1 id="case-response-title">Case 响应工作台</h1>
        <p id="case-response-subtitle">正在加载 Case…</p>
      </div>
      <div class="case-response-actions">
        <button id="case-response-refresh" type="button">刷新</button>
        <button id="case-response-generate" class="primary" type="button">生成新版本</button>
      </div>
    </header>

    <main class="case-response-main" aria-busy="false">
      <div id="case-response-status" class="case-response-status" role="status" aria-live="polite"></div>
      <section id="case-response-overview" class="case-response-overview" aria-label="Case overview"></section>

      <section class="case-response-section" aria-labelledby="response-summary-heading">
        <div class="case-response-section-heading">
          <div>
            <span>01</span>
            <h2 id="response-summary-heading">Case 摘要</h2>
          </div>
        </div>
        <div id="case-response-summary" class="case-response-section-body"></div>
      </section>

      <section class="case-response-section" aria-labelledby="response-containment-heading">
        <div class="case-response-section-heading">
          <div>
            <span>02</span>
            <h2 id="response-containment-heading">精细遏制建议</h2>
          </div>
          <strong id="case-response-containment-state"></strong>
        </div>
        <div id="case-response-containment" class="case-response-section-body"></div>
      </section>

      <section class="case-response-section" aria-labelledby="response-playbook-heading">
        <div class="case-response-section-heading">
          <div>
            <span>03</span>
            <h2 id="response-playbook-heading">响应 Playbook</h2>
          </div>
          <button id="case-response-agent-open" class="case-response-agent-open primary" type="button">
            唤起调查 Agent
          </button>
        </div>
        <div id="case-response-playbook" class="case-response-section-body"></div>
      </section>

      <section class="case-response-section" aria-labelledby="response-communication-heading">
        <div class="case-response-section-heading">
          <div>
            <span>04</span>
            <h2 id="response-communication-heading">内部事件沟通草稿</h2>
          </div>
          <div class="case-response-section-tools">
            <strong id="case-response-communication-state"></strong>
            <button id="case-response-copy-report" class="case-response-copy-report" type="button" disabled>
              复制汇报内容
            </button>
          </div>
        </div>
        <div id="case-response-communication" class="case-response-section-body"></div>
      </section>

      <section class="case-response-section" aria-labelledby="response-timeline-heading">
        <div class="case-response-section-heading">
          <div>
            <span>05</span>
            <h2 id="response-timeline-heading" tabindex="-1">事件时间线</h2>
          </div>
          <strong id="case-response-timeline-count"></strong>
        </div>
        <div id="case-response-timeline" class="case-response-section-body" aria-busy="false"></div>
        <nav id="case-response-timeline-pagination" class="case-response-pagination" aria-label="Timeline pagination" aria-busy="false"></nav>
      </section>
    </main>

    <div id="response-agent-backdrop" class="response-agent-backdrop" hidden></div>
    <aside
      id="response-agent-drawer"
      class="response-agent-drawer"
      aria-labelledby="response-agent-title"
      aria-hidden="true"
      hidden
    >
      <header class="response-agent-header">
        <div>
          <span id="response-agent-kicker">Response Agent</span>
          <h2 id="response-agent-title">深度响应调查</h2>
        </div>
        <div class="response-agent-header-actions">
          <button
            id="response-agent-expand"
            class="response-agent-icon-button response-agent-expand"
            type="button"
            aria-label="展开"
            aria-pressed="false"
            title="展开"
          >
            <svg
              class="response-agent-expand-icon response-agent-expand-icon-wide"
              aria-hidden="true"
              viewBox="0 0 24 24"
            >
              <path d="M15 3h6v6"></path>
              <path d="m21 3-7 7"></path>
              <path d="m3 21 7-7"></path>
              <path d="M9 21H3v-6"></path>
            </svg>
            <svg
              class="response-agent-expand-icon response-agent-expand-icon-narrow"
              aria-hidden="true"
              viewBox="0 0 24 24"
              hidden
            >
              <path d="m14 10 7-7"></path>
              <path d="M20 10h-6V4"></path>
              <path d="m3 21 7-7"></path>
              <path d="M4 14h6v6"></path>
            </svg>
          </button>
          <button
            id="response-agent-close"
            class="response-agent-icon-button response-agent-close"
            type="button"
            aria-label="关闭"
            title="关闭"
          >
            ×
          </button>
        </div>
      </header>
      <div class="response-agent-body">
        <div id="response-agent-notice" class="response-agent-notice" role="status" aria-live="polite"></div>
        <section id="response-agent-start-panel" class="response-agent-start-panel">
          <label for="response-agent-goal" id="response-agent-goal-label">调查目标</label>
          <textarea id="response-agent-goal" rows="4"></textarea>
          <button id="response-agent-start" class="primary" type="button">开始调查</button>
        </section>
        <section id="response-agent-session-panel" class="response-agent-session-panel" hidden>
          <div class="response-agent-session-head">
            <div>
              <span id="response-agent-session-label">调查会话</span>
              <strong id="response-agent-session-id">-</strong>
            </div>
            <span id="response-agent-status" class="case-response-state tone-neutral">-</span>
          </div>
          <dl id="response-agent-metrics" class="response-agent-metrics"></dl>
          <section class="response-agent-band" aria-labelledby="response-agent-plan-title">
            <h3 id="response-agent-plan-title">调查计划</h3>
            <div id="response-agent-plan"></div>
          </section>
          <section class="response-agent-band response-agent-trace-band" aria-labelledby="response-agent-trace-title">
            <button
              id="response-agent-trace-toggle"
              class="response-agent-trace-toggle"
              type="button"
              aria-expanded="true"
              aria-controls="response-agent-trace"
            >
              <span id="response-agent-trace-title" class="response-agent-trace-title" role="heading" aria-level="3">调查轨迹</span>
              <span id="response-agent-trace-count" class="response-agent-trace-count">0 步</span>
              <span class="response-agent-trace-chevron" aria-hidden="true"></span>
            </button>
            <div id="response-agent-trace"></div>
          </section>
          <form id="response-agent-input-form" class="response-agent-input-form" hidden>
            <label id="response-agent-input-label" for="response-agent-input">补充信息</label>
            <textarea id="response-agent-input" rows="3" required></textarea>
            <button id="response-agent-input-submit" type="submit">提交并继续</button>
          </form>
          <section id="response-agent-report-band" class="response-agent-band response-agent-report-band" hidden aria-labelledby="response-agent-report-title">
            <h3 id="response-agent-report-title">深度调查报告</h3>
            <div id="response-agent-report"></div>
          </section>
        </section>
      </div>
      <footer id="response-agent-controls" class="response-agent-controls" hidden>
        <button id="response-agent-pause" type="button">暂停</button>
        <button id="response-agent-resume" type="button">继续</button>
        <button id="response-agent-cancel" class="danger" type="button">取消</button>
        <button id="response-agent-rerun" class="primary" type="button" hidden>重新执行</button>
      </footer>
    </aside>
    <script src="/case-response.js"></script>
  </body>
</html>
